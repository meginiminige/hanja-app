<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="谐声系" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
  <title>谐声系</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #F2F2F7;
    }
    @media (prefers-color-scheme: dark) {
      html, body {
        background-color: #000000;
      }
    }
    body {
      position: fixed;
      inset: 0;
      padding-top: env(safe-area-inset-top, 0px);
    }
    #appFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background-color: transparent;
    }
  </style>
</head>
<body>
  <iframe id="appFrame" allow="clipboard-read; clipboard-write"></iframe>
  <script>
    const base = "https://script.google.com/macros/s/AKfycbwAGM27Wz6rdpm4-3e_Mj9QAZctqLpAipqbNB9kVjIJE_COUj824Pqf-GUCzydq7CQA/exec";
    document.getElementById("appFrame").src = base + window.location.search;
  </script>
</body>
</html>
